<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argon Mobile Hub • OTA Distribution</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #141b2d;
            --primary: #38bdf8;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .icon {
            font-size: 54px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            color: #fff;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .download-btn {
            display: block;
            background: #0284c7;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .download-btn:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }
        .meta {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📱</div>
        <h1>Argon Mobile Hub</h1>
        <div class="badge" id="versionBadge">Checking version...</div>
        <p>Native mobile companion for your Raspberry Pi homelab with automatic failover to Tailscale.</p>
        <a href="/argon-hub.apk" class="download-btn" id="downloadBtn">Download APK</a>
        <div class="meta" id="metaInfo">Only one live APK is maintained on Pi for Over-The-Air updates.</div>
    </div>

    <script>
        fetch('/version.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('versionBadge').textContent = 'Version ' + data.versionName + ' (Build ' + data.versionCode + ')';
                if (data.releaseNotes) {
                    document.getElementById('metaInfo').textContent = 'Notes: ' + data.releaseNotes;
                }
            })
            .catch(() => {
                document.getElementById('versionBadge').textContent = 'Latest Release';
            });
    </script>
</body>
</html>
