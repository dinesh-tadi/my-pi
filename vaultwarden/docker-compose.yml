services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=true
      - INVITATIONS_ALLOWED=true
      - SHOW_PASSWORD_HINT=false
      - DOMAIN=http://192.168.1.10:8085
      - ENABLE_DB_WAL=true
    volumes:
      - ./data:/data
    ports:
      - "8085:80"
