services:
  usb-forensics:
    build: .
    image: local/usb-forensics:latest
    container_name: usb-forensics
    restart: unless-stopped
    privileged: true
    ports:
      - "8094:8094"
    env_file:
      - ../stock-watcher/.env
    environment:
      - QUARANTINE_BASE=/media/quarantine
      - POLL_INTERVAL_SECS=5
      - METRICS_PORT=8094
      - PYTHONUNBUFFERED=1
    volumes:
      - /dev:/dev
      - /proc:/proc:ro
      - /sys:/sys:ro
      - ./quarantine:/media/quarantine:rshared
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
