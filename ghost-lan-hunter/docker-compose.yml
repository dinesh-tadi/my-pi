services:
  ghost-lan-hunter:
    build: .
    image: local/ghost-lan-hunter:latest
    container_name: ghost-lan-hunter
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../stock-watcher/.env
    environment:
      - SUBNET=192.168.1.0/24
      - SCAN_INTERVAL_SECS=90
      - METRICS_PORT=8093
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
