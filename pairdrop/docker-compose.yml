services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop
    restart: unless-stopped
    ports:
      - "8088:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WS_FALLBACK=true
      - RATE_LIMIT=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
