services:
  chromium-sandbox:
    image: lscr.io/linuxserver/chromium:latest
    container_name: chromium-sandbox
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - CHROME_CLI=https://duckduckgo.com/
    volumes:
      - ./config:/config
    ports:
      - "3002:3000"   # HTTP web access: http://192.168.1.10:3002
      - "3003:3001"   # HTTPS web access: https://192.168.1.10:3003
    shm_size: "1gb"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
