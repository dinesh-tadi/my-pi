name: CI/CD Pipeline & Pi Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Validate Stacks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Version Upgrade Gate
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=10
          
          if [ ! -f VERSION ]; then
            echo "❌ ERROR: Root 'VERSION' file is missing in PR!"
            exit 1
          fi
          
          NEW_VERSION=$(tr -d ' \r\n' < VERSION)
          
          if git show origin/main:VERSION > /dev/null 2>&1; then
            BASE_VERSION=$(git show origin/main:VERSION | tr -d ' \r\n')
          else
            BASE_VERSION="2.0.0"
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Base (main) Version: v${BASE_VERSION}"
          echo "🔍 PR (branch) Version: v${NEW_VERSION}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          python3 -c "
          import sys

          def parse_semver(v):
              clean = v.strip().lstrip('v').split('-')[0]
              parts = [int(p) for p in clean.split('.')]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts)

          base_str = '$BASE_VERSION'
          new_str = '$NEW_VERSION'
          base_v = parse_semver(base_str)
          new_v = parse_semver(new_str)

          if new_v <= base_v:
              print(f'❌ BLOCKED: VERSION must be upgraded (at least a patch bump)! Base is v{base_str}, found v{new_str}.')
              sys.exit(1)

          print(f'✅ Version upgrade gate passed! v{base_str} ➔ v{new_str}')
          "

      - name: Check Shell Script Syntax
        run: |
          echo "Checking shell scripts..."
          bash -n deploy.sh
          if [ -d scripts ]; then
            for f in scripts/*.sh; do
              [ -e "$f" ] && bash -n "$f"
            done
          fi
          echo "✅ Shell scripts syntax valid!"

      - name: Validate Docker Compose Stacks
        run: |
          echo "Validating Docker Compose configurations..."
          # Mock .env files for validation step if needed
          [ -f stock-watcher/.env.example ] && [ ! -f stock-watcher/.env ] && cp stock-watcher/.env.example stock-watcher/.env || true
          [ -f watchtower/.env.example ] && [ ! -f watchtower/.env ] && cp watchtower/.env.example watchtower/.env || true
          [ -f argon-auth/.env.example ] && [ ! -f argon-auth/.env ] && cp argon-auth/.env.example argon-auth/.env || true

          FAILED=0
          for dir in */; do
            if [ -f "${dir}docker-compose.yml" ]; then
              echo "Checking ${dir}docker-compose.yml..."
              if (cd "$dir" && docker compose config > /dev/null); then
                echo "  -> Valid"
              else
                echo "  -> ❌ FAILED"
                FAILED=1
              fi
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "❌ Validation failed for one or more Docker Compose files."
            exit 1
          fi
          echo "✅ All 17 Docker Compose stacks are syntactically valid!"

  deploy:
    name: Deploy to Raspberry Pi
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy on Raspberry Pi via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PI_HOST || '100.123.87.122' }}
          username: ${{ secrets.PI_USER || 'argon' }}
          key: ${{ secrets.PI_SSH_KEY }}
          script: |
            set -e
            echo "Connected to Raspberry Pi: $(hostname)"
            cd ~/my-pi
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy-local.sh
            ./scripts/deploy-local.sh
