services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 45876
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHVqSiXWVRh7e3lsPTjFT3u1oRvC/agXL3S+njpXpY+C beszel-hub"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
