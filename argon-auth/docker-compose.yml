services:
  argon-auth:
    build: .
    image: local/argon-auth:latest
    container_name: argon-auth
    restart: unless-stopped
    ports:
      - "80:8089"
      - "8089:8089"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - AUTH_DB_DIR=/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
